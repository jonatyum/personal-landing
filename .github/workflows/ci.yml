name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run guard
      - run: npm run check:content
      - run: npm run check
      # Mirrors how Pages serves the site today, so base-path bugs fail here first and the
      # canonical URLs, sitemap and language alternates have something to assert against.
      # When jonatyum.com goes live, set SITE_URL to https://jonatyum.com and drop BASE_PATH.
      - run: npm run build
        env:
          SITE_URL: https://jonatyum.github.io
          BASE_PATH: /personal-landing
      - run: npm run check:dist
        env:
          BASE_PATH: /personal-landing

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          BASE_PATH: /personal-landing
