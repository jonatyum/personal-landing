name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run guard
      - run: npm run check:content
      - run: npm run check
      # No env: the custom domain serves from the root and astro.config reads it from
      # public/CNAME, so this builds exactly what the deploy publishes.
      - run: npm run build
      - run: npm run check:dist

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
