name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Build like the GitHub Pages project site, so base-path bugs fail here first.
      BASE_PATH: /personal-landing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run guard
      - run: npm run check:content
      - run: npm run check
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - run: npm run check:dist

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
